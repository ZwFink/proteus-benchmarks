# Select scheduler backend: flux or slurm
scheduler: flux

proteus:
  # Update these paths to match your Proteus install before running the workflow.
  path: /usr/workspace/fink12/proteus/proteus/install-tuolumne-rocm-6.4.0/
  cc: /opt/rocm-6.4.0/bin/hipcc

driver:
  # `driver.py` is resolved relative to this repo by default; override if needed.
  descriptor: hecbench.toml
  runconfigs:
    proteus: presets/proteus.toml
    aot: presets/aot.toml
    dsl: presets/dsl.toml
    cpp: presets/cpp.toml
  results_dir: results_amd/
  reps: 5

workflow:
  benchmarks:
    - 3mm
    - adam
    - attention
    - bezier-surface
    - conv3d
    - gemm
    - floyd-warshall
    - minibude
  execution_modes:
    - aot
    - proteus
    - dsl
    - cpp
  machines:
    - amd
  prof_modes:
    - direct
  machine_setup:
    amd: "source /usr/workspace/fink12/proteus/activate_tuolumne.sh"

slurm:
  options:
    - --nodes=1
    - --time=00:15:00
    - --partition=pbatch
    - --tasks-per-node=1
    - --gpus-per-task=1
    - --exclusive
  env: {}
flux:
  options:
    - -N
    - "1"
    - --time=19m
    - --queue=pbatch
    - --exclusive
  env:
    CPLUS_INCLUDE_PATH: /opt/rocm-6.4.0/include
