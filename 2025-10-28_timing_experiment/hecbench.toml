[hecbench]
[hecbench.config.build.nvidia]
command = "make -j"
[hecbench.config.build.nvidia.clean]
command = "make -j clean"
[hecbench.config.build.nvidia.dsl]
command = "make -j GPU_BACKEND=cuda"
[hecbench.config.build.nvidia.cpp]
command = "make -j GPU_BACKEND=cuda"
[hecbench.config.build.amd]
command = "make -j"
[hecbench.config.build.amd.clean]
command = "make -j clean"
[hecbench.config.build.amd.dsl]
command = "make -j GPU_BACKEND=hip"
[hecbench.config.build.amd.cpp]
command = "make -j GPU_BACKEND=hip"

[hecbench.adam]
[hecbench.adam.nvidia]
[hecbench.adam.nvidia.aot]
path = "benchmarks/hecbench/cuda/adam"
exe = "adam-aot.x"
[hecbench.adam.nvidia.proteus]
path = "benchmarks/hecbench/cuda/adam"
exe = "adam-proteus.x"
[hecbench.adam.nvidia.jitify]
path = "benchmarks/hecbench/cuda-jitify/adam"
exe = "adam-jitify.x"
[hecbench.adam.nvidia.cpp]
path = "benchmarks/hecbench/cpp_frontend/adam"
exe = "adam-cpp-proteus.x"
[hecbench.adam.amd.aot]
path = "benchmarks/hecbench/hip/adam"
exe = "adam-aot.x"
[hecbench.adam.amd.proteus]
path = "benchmarks/hecbench/hip/adam"
exe = "adam-proteus.x"
[hecbench.adam.amd.cpp]
path = "benchmarks/hecbench/cpp_frontend/adam"
exe = "adam-cpp-proteus.x"
[hecbench.adam.inputs]
default = "160000 1600 1"

[hecbench.adam.dsl]
[hecbench.adam.amd.dsl]
path = "benchmarks/hecbench/dsl/adam"
exe = "adam-proteus.x"
[hecbench.adam.nvidia.dsl]
